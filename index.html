<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="Iglesia Amistad Cristiana, Comayagüela, Honduras. Cultos los domingos de 10:00 a. m. a 12:00 m.">
<title>IGLESIA AMISTAD CRISTIANA · Comayagüela</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f4f2f2;--tx:#141414;--mu:#555;--rd:#b00d1b;--ln:#dcdcdc}
:root[data-t=dark]{--bg:#0a0a0a;--bg2:#151515;--tx:#f0f0f0;--mu:#a9a9a9;--rd:#e5383b;--ln:#2b2b2b}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.65 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.15;margin:0}
h2{font-size:2.3rem;margin-bottom:.4rem}h3{font-size:1.45rem}
a{color:var(--rd)}.w{max-width:1050px;margin:0 auto;padding:0 1.2rem}
section{padding:4rem 0}main section:nth-of-type(even){background:var(--bg2)}
.sub{color:var(--mu);max-width:60ch;margin:0 0 1.8rem}
nav{position:sticky;top:0;z-index:9;background:#0a0a0a;border-bottom:3px solid #b00d1b;color:#fff}
nav .w{display:flex;align-items:center;gap:1rem;height:56px}
nav b{font:700 1.05rem "Cormorant Garamond",serif;white-space:nowrap;letter-spacing:.04em}
nav .l{display:flex;gap:1rem;overflow-x:auto;flex:1;scrollbar-width:none}
nav .l a{color:#ddd;text-decoration:none;font-size:.95rem;white-space:nowrap}nav .l a:hover{color:#ff4d57}
button,.b{font:600 1rem inherit;font-family:inherit;cursor:pointer;border-radius:3px;padding:.7rem 1.3rem;border:2px solid var(--rd);background:var(--rd);color:#fff;text-decoration:none;display:inline-block}
.b.o,button.o{background:transparent;color:var(--rd)}
#th{padding:.3rem .7rem;background:transparent;border-color:#666;color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ff4d57;outline-offset:2px}
.hero{background:radial-gradient(circle at 50% 25%,#4a0a10,#0a0a0a 65%);color:#fff;text-align:center;padding:3.5rem 0 4rem;border-bottom:6px solid #b00d1b}
.logo{width:230px;height:230px;border-radius:50%;background:#fff;border:5px solid #b00d1b;object-fit:contain;margin-bottom:1.5rem}
.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);letter-spacing:.06em}
.hero p{color:#c9c9c9;margin:.8rem auto 1.8rem;max-width:52ch}
.hero .b.o{color:#fff;border-color:#fff}
.vd{background:#b00d1b;color:#fff;text-align:center;padding:2.2rem 0}
.vd q{font:500 1.6rem/1.35 "Cormorant Garamond",serif;display:block;max-width:34ch;margin:0 auto .4rem;quotes:none}
.g{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--bg);border:1px solid var(--ln);border-top:4px solid var(--rd);padding:1.3rem}
.c p{margin:.4rem 0 0;color:var(--mu)}
.hr{font:700 2rem "Cormorant Garamond",serif;color:var(--rd)}
.ini{width:44px;height:44px;border-radius:50%;background:#0a0a0a;color:#fff;border:2px solid var(--rd);display:grid;place-items:center;font:700 1.3rem "Cormorant Garamond",serif;margin-bottom:.6rem}
.dt{color:var(--rd);font-weight:600}
form{display:grid;gap:.8rem;max-width:560px}
input,textarea,select{width:100%;padding:.7rem;border:1px solid var(--ln);border-radius:3px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:.9rem;color:var(--mu);display:block}
iframe{width:100%;height:320px;border:1px solid var(--ln)}
footer{background:#0a0a0a;color:#bbb;text-align:center;padding:2rem 1rem;border-top:6px solid #b00d1b;font-size:.9rem}
footer button{background:none;border:0;color:#bbb;text-decoration:underline;padding:0;font-weight:400}
.pre{white-space:pre-line}
#ad{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;overflow:auto;display:none}
#ad .p{background:var(--bg);max-width:760px;margin:2vh auto;padding:1.4rem;border-top:5px solid var(--rd)}
#ad fieldset{border:1px solid var(--ln);margin:0 0 1rem;padding:1rem;display:grid;gap:.6rem}
#ad legend{font-weight:600;color:var(--rd)}
.row{display:grid;gap:.5rem;border-bottom:1px dashed var(--ln);padding-bottom:.8rem}
.bar{position:sticky;bottom:0;background:var(--bg);padding:.8rem 0;display:flex;gap:.6rem;flex-wrap:wrap}
.cd{margin-top:2rem}.cd p{margin:0 0 .6rem}.cd div{display:flex;gap:.6rem;justify-content:center}
.cd span{background:#1b1b1b;border:1px solid #b00d1b;min-width:64px;padding:.5rem;font-size:.8rem;color:#bbb}.cd span b{display:block;font:700 1.8rem "Cormorant Garamond",serif;color:#fff}
.vd button{margin-top:.8rem;background:transparent;border-color:#fff;color:#fff;padding:.4rem 1rem}
img.ph{display:block;width:calc(100% + 2.6rem);height:180px;object-fit:cover;margin:-1.3rem -1.3rem 1rem}
.gal{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.gal figure{margin:0;cursor:zoom-in}
.gal img{width:100%;height:190px;object-fit:cover;display:block;border:1px solid var(--ln)}.gal figcaption{font-size:.9rem;color:var(--mu)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}#lb img{max-width:100%;max-height:92vh}
details{border:1px solid var(--ln);background:var(--bg);margin-bottom:.6rem;padding:.8rem 1rem}summary{cursor:pointer;font-weight:600}
details[open]{border-left:4px solid var(--rd)}details p{margin:.6rem 0 0;color:var(--mu)}
.fab{position:fixed;right:16px;bottom:16px;z-index:8;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.4);background:#1f8f4a;border-color:#1f8f4a}
.c:hover{border-color:var(--rd)}
@media(max-width:600px){.logo{width:170px;height:170px}h2{font-size:1.9rem}nav b{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav><div class="w"><b>IGLESIA AMISTAD CRISTIANA</b>
<div class="l"><a href="#horarios">Horarios</a><a href="#nosotros">Quiénes somos</a><a href="#ministerios">Ministerios</a><a href="#eventos">Eventos</a><a href="#mensajes">Mensajes</a><a href="#visita">Visítanos</a><a href="#oracion">Oración</a><a href="#ofrendas">Ofrendas</a><a href="#contacto">Contacto</a></div>
<button id="th" class="o" aria-label="Cambiar entre modo claro y oscuro">Modo</button></div></nav>
<main id="app"></main>
<footer><p id="ft"></p><p><button id="adm">Administrar página</button></p></footer>
<div id="lb" aria-label="Foto ampliada"></div>
<div id="ad" role="dialog" aria-modal="true" aria-label="Panel de administración"><div class="p" id="adp"></div></div>

<script>
const D0={
nombre:"IGLESIA AMISTAD CRISTIANA",sub:"Iglesia evangélica en Comayagüela, Honduras",
direccion:"A la derecha de Bellas Artes, Comayagüela, Honduras",mapa:"14.0987903,-87.2074958",maplink:"https://maps.app.goo.gl/2bHamMUHCQ4hamBeA",
tel:"",correo:"",facebook:"",youtube:"",
historia:"Somos una iglesia evangélica en Comayagüela donde hay un lugar para toda la familia: niños, jóvenes, damas, caballeros y adultos mayores.",
mision:"Llevar el amor de Cristo a cada persona y a nuestra ciudad.",
vision:"Ser una familia unida en la fe, que sirve y comparte el evangelio.",
ofrendas:"Para dar tu ofrenda o diezmo, pregunta a los ujieres en el culto o comunícate con nosotros. Dios ama al dador alegre.",
aviso:"Por ahora transmitimos por Facebook. En el aniversario de la iglesia, la primera semana de diciembre, tendremos una transmisión especial de mayor calidad.",
pass:"amistad2026",
pastores:[{n:"Nelson Orellana",r:"Pastor",t:"Edita esta descripción desde el panel de administración."},{n:"Lesbi Ferrari",r:"Pastora",t:"Edita esta descripción desde el panel de administración."}],
horarios:[{d:"Domingo",h:"9:00 a. m.",n:"Discipulado"},{d:"Domingo",h:"10:00 a. m. a 12:00 m.",n:"Culto general"}],
ministerios:[{n:"Alabanza",t:"Adoramos a Dios con nuestros instrumentos y voces."},{n:"Niños",t:"Enseñamos la Biblia a los más pequeños de forma alegre."},{n:"Danza",t:"Expresamos nuestra adoración con movimiento."},{n:"Jóvenes",t:"Un espacio para crecer en la fe y en amistad."},{n:"Ujieres",t:"Reciben y atienden con amabilidad a todos."},{n:"Damas",t:"Mujeres que se apoyan, oran y sirven juntas."},{n:"Caballeros",t:"Hombres que crecen y sirven como familia."}],
eventos:[{n:"Aniversario de la iglesia",f:"2026-12-01",l:"Iglesia Amistad Cristiana",t:"Celebración durante la primera semana de diciembre, con transmisión especial por Facebook."}],
predicas:[],galeria:[],faq:[{q:"¿Qué debo llevar a mi primera visita?",a:"Solo a ti y a tu familia. Ven como estás, aquí serás bienvenido."},{q:"¿Hay actividades para los niños?",a:"Sí. El ministerio de niños les enseña la Biblia de forma alegre y segura."},{q:"¿A qué hora empiezan los cultos?",a:"Los domingos a las 10:00 a. m. (hasta las 12:00 m.). A las 9:00 a. m. hay discipulado."},{q:"¿Cómo llego a la iglesia?",a:"Estamos a la derecha de Bellas Artes, en Comayagüela. Usa el botón «Cómo llegar» al final de la página."}],
versiculos:[{t:"Jehová es mi pastor; nada me faltará.",r:"Salmos 23:1"},{t:"Todo lo puedo en Cristo que me fortalece.",r:"Filipenses 4:13"},{t:"Jehová es mi luz y mi salvación; ¿de quién temeré?",r:"Salmos 27:1"},{t:"Confía en Jehová con todo tu corazón.",r:"Proverbios 3:5"},{t:"El amor nunca deja de ser.",r:"1 Corintios 13:8"},{t:"Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.",r:"Mateo 11:28"}]};
const LISTS={
pastores:["Pastores",[["n","Nombre"],["r","Cargo"],["i","Foto (ej. fotos/pastor.jpg)"],["t","Descripción","a"]]],
horarios:["Horarios",[["d","Día"],["h","Hora"],["n","Actividad"]]],
ministerios:["Ministerios",[["n","Nombre"],["i","Foto (opcional, ej. fotos/alabanza.jpg)"],["t","Descripción","a"]]],
eventos:["Eventos",[["n","Nombre"],["f","Fecha","date"],["l","Lugar"],["t","Detalle","a"]]],
predicas:["Mensajes (prédicas)",[["t","Título"],["u","Enlace del video"]]],
galeria:["Galería de fotos",[["i","Archivo de la foto (ej. fotos/culto1.jpg)"],["t","Descripción"]]],
faq:["Preguntas frecuentes",[["q","Pregunta"],["a","Respuesta","a"]]],
versiculos:["Versículos del día",[["t","Texto","a"],["r","Cita"]]]};
const FIELDS=[["nombre","Nombre de la iglesia"],["sub","Subtítulo"],["direccion","Dirección"],["mapa","Ubicación en el mapa (coordenadas)"],["maplink","Enlace de Google Maps (botón Cómo llegar)"],["tel","WhatsApp (solo números con código de país, ej. 50499999999)"],["correo","Correo electrónico"],["facebook","Enlace de Facebook (https://...)"],["youtube","Enlace de YouTube (https://...)"],["historia","Quiénes somos","a"],["mision","Misión","a"],["vision","Visión","a"],["ofrendas","Texto de ofrendas","a"],["aviso","Aviso de transmisión","a"],["pass","Contraseña del panel"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img=s=>/^[\w\-\/.%]+$/.test(s||"")&&!/^\./.test(s)?s:"";
const pi=s=>img(s)?`<img class="ph" src="${esc(img(s))}" alt="" loading="lazy">`:"";
let vi=Math.floor(Date.now()/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const url=u=>/^https?:\/\//i.test(u)?u:"";
function load(){try{const s=localStorage.getItem("iac");if(s){const o=Object.assign(clone(D0),JSON.parse(s));if(/Bellas Artes/.test(o.mapa))o.mapa=D0.mapa;return o}}catch(e){}return clone(D0)}
function save(){try{localStorage.setItem("iac",JSON.stringify(D));return true}catch(e){alert("Este navegador no permitió guardar. Usa «Descargar copia».");return false}}
let D=load();

function fb(){return url(D.facebook)||"https://www.facebook.com/search/top?q="+encodeURIComponent("Iglesia Amistad Cristiana Comayagüela")}
function fecha(f){const d=new Date(f+"T12:00:00");return isNaN(d)?"":d.toLocaleDateString("es-HN",{day:"numeric",month:"long",year:"numeric"})}
function faltan(f){const d=new Date(f+"T00:00:00"),n=Math.ceil((d-new Date())/864e5);return isNaN(n)||n<0?"":n===0?"¡Es hoy!":"Faltan "+n+" día"+(n>1?"s":"")}

function render(){
const v=D.versiculos.length?D.versiculos[vi%D.versiculos.length]:null;
const ev=[...D.eventos].sort((a,b)=>(a.f||"").localeCompare(b.f||""));
$("#app").innerHTML=`
<header class="hero"><div class="w">
<img class="logo" src="logo.jpg" alt="Logo de la Iglesia Amistad Cristiana: una paloma, un globo terráqueo y dos manos">
<h1>${esc(D.nombre)}</h1><p>${esc(D.sub)}</p>
<a class="b" href="#horarios">Horarios de cultos</a> <a class="b o" href="#contacto">Cómo llegar</a><div class="cd" id="cd"></div></div></header>
${v?`<div class="vd"><div class="w"><q id="vq">${esc(v.t)}</q><span id="vr">${esc(v.r)}</span><br><button id="vn">Otro versículo</button></div></div>`:""}
<section id="horarios"><div class="w"><h2>Horarios</h2><p class="sub">Te esperamos. Hay un lugar para ti y para toda tu familia.</p>
<div class="g">${D.horarios.map(h=>`<div class="c"><div class="dt">${esc(h.d)}</div><div class="hr">${esc(h.h)}</div><p>${esc(h.n)}</p></div>`).join("")}</div></div></section>
<section id="nosotros" class="alt"><div class="w"><h2>Quiénes somos</h2><p class="pre sub">${esc(D.historia)}</p>
<div class="g"><div class="c"><h3>Misión</h3><p>${esc(D.mision)}</p></div><div class="c"><h3>Visión</h3><p>${esc(D.vision)}</p></div></div>
<h3 style="margin:2rem 0 1rem">Nuestros pastores</h3>
<div class="g">${D.pastores.map(p=>`<div class="c">${pi(p.i)}<h3>${esc(p.n)}</h3><div class="dt">${esc(p.r)}</div><p>${esc(p.t)}</p></div>`).join("")}</div></div></section>
<section id="ministerios"><div class="w"><h2>Ministerios</h2><p class="sub">Desde los niños hasta las señoras y caballeros, todos pueden servir y crecer.</p>
<div class="g">${D.ministerios.map(m=>`<div class="c">${img(m.i)?pi(m.i):`<div class="ini" aria-hidden="true">${esc((m.n||"?")[0])}</div>`}<h3>${esc(m.n)}</h3><p>${esc(m.t)}</p></div>`).join("")}</div></div></section>
<section id="eventos" class="alt"><div class="w"><h2>Próximos eventos</h2><p class="sub"></p>
${ev.length?`<div class="g">${ev.map(e=>`<div class="c"><div class="dt">${esc(fecha(e.f))}</div><h3>${esc(e.n)}</h3><p>${esc(e.t)}</p>${e.l?`<p><b>Lugar:</b> ${esc(e.l)}</p>`:""}${faltan(e.f)?`<p class="dt">${faltan(e.f)}</p>`:""}</div>`).join("")}</div>`:`<p>No hay eventos publicados por ahora.</p>`}</div></section>
${D.galeria.some(g=>img(g.i))?`<section id="galeria"><div class="w"><h2>Galería</h2><p class="sub">Momentos de nuestra iglesia. Toca una foto para verla grande.</p><div class="gal">${D.galeria.filter(g=>img(g.i)).map(g=>`<figure><img src="${esc(img(g.i))}" alt="${esc(g.t)}" loading="lazy"><figcaption>${esc(g.t)}</figcaption></figure>`).join("")}</div></div></section>`:""}
<section id="mensajes"><div class="w"><h2>Mensajes y transmisión</h2><p class="sub pre">${esc(D.aviso)}</p>
${D.predicas.length?`<div class="g">${D.predicas.map(p=>`<div class="c"><h3>${esc(p.t)}</h3><p>${url(p.u)?`<a href="${esc(p.u)}" target="_blank" rel="noopener">Ver mensaje</a>`:""}</p></div>`).join("")}</div><br>`:""}
<a class="b" href="${esc(fb())}" target="_blank" rel="noopener">Ver en Facebook</a>
${url(D.youtube)?` <a class="b o" href="${esc(D.youtube)}" target="_blank" rel="noopener">Ver en YouTube</a>`:""}</div></section>
${D.faq.length?`<section id="visita"><div class="w"><h2>Tu primera visita</h2><p class="sub">Respuestas rápidas para que vengas con confianza.</p>${D.faq.map(q=>`<details><summary>${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join("")}</div></section>`:""}
<section id="oracion"><div class="w"><h2>Peticiones de oración</h2><p class="sub">Cuéntanos por qué quieres que oremos. Se envía por WhatsApp o correo a los líderes de la iglesia.</p>
<form id="pf"><div><label for="pn">Tu nombre (opcional)</label><input id="pn" autocomplete="name"></div>
<div><label for="pt">Tu petición</label><textarea id="pt" rows="4" required></textarea></div>
<button>Enviar petición</button></form></div></section>
<section id="ofrendas"><div class="w"><h2>Ofrendas</h2><p class="pre sub">${esc(D.ofrendas)}</p></div></section>
<section id="contacto" class="alt"><div class="w"><h2>Contacto y ubicación</h2><p class="sub">${esc(D.direccion)}</p>
<p>${D.tel?`<a class="b" href="https://wa.me/${esc(D.tel.replace(/\D/g,""))}" target="_blank" rel="noopener">WhatsApp</a> `:""}${D.correo?`<a class="b o" href="mailto:${esc(D.correo)}">Correo</a> `:""}<a class="b o" href="${esc(fb())}" target="_blank" rel="noopener">Facebook</a> <a class="b o" href="${esc(url(D.maplink)||"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(D.mapa))}" target="_blank" rel="noopener">Cómo llegar</a> <button class="o" id="sh">Compartir página</button></p>
<iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d483.7041240366242!2d-87.20752413988109!3d14.098829412716576!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f6fa35e6f59bb9f%3A0x9780e82aa0b3e049!2sIglesia%20Amistad%20Cristiana!5e0!3m2!1ses-419!2sus!4v1793650115010!5m2!1ses-419!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
${D.tel?`<a class="b fab" href="https://wa.me/${esc(D.tel.replace(/\D/g,""))}" target="_blank" rel="noopener">WhatsApp</a>`:""}`;
$("#ft").textContent="© "+new Date().getFullYear()+" "+D.nombre+" · Comayagüela, Honduras";
$("#vn")&&($("#vn").onclick=()=>{vi++;const x=D.versiculos[vi%D.versiculos.length];$("#vq").textContent=x.t;$("#vr").textContent=x.r});
$("#sh").onclick=()=>{if(navigator.share)navigator.share({title:D.nombre,url:location.href}).catch(()=>{});else{try{navigator.clipboard.writeText(location.href);alert("Enlace copiado")}catch(e){alert(location.href)}}};
tick();
$("#pf").onsubmit=e=>{e.preventDefault();
const m="Petición de oración"+($("#pn").value?" de "+$("#pn").value:"")+": "+$("#pt").value;
if(D.tel)window.open("https://wa.me/"+D.tel.replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank");
else if(D.correo)location.href="mailto:"+D.correo+"?subject="+encodeURIComponent("Petición de oración")+"&body="+encodeURIComponent(m);
else alert("La iglesia aún no ha configurado dónde recibir peticiones. Por favor, avisa a un líder.")}}

/* Tema */
function tema(t){document.documentElement.dataset.t=t;try{localStorage.setItem("iac-t",t)}catch(e){}}
let t0;try{t0=localStorage.getItem("iac-t")}catch(e){}
tema(t0||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#th").onclick=()=>tema(document.documentElement.dataset.t==="dark"?"light":"dark");

/* Panel de administración */
let W;
function panel(){
const f=(k,l,ty,val,attr)=>ty==="a"?`<label>${l}<textarea rows="3" ${attr}>${esc(val)}</textarea></label>`:`<label>${l}<input ${ty==="date"?'type="date"':""} value="${esc(val)}" ${attr}></label>`;
$("#adp").innerHTML=`<h2>Administrar página</h2><p class="sub">Cambia lo que quieras y pulsa «Guardar cambios».</p>
<fieldset><legend>Datos generales</legend>${FIELDS.map(x=>f(x[0],x[1],x[2],W[x[0]],`data-k="${x[0]}"`)).join("")}</fieldset>
${Object.keys(LISTS).map(k=>`<fieldset><legend>${LISTS[k][0]}</legend>${W[k].map((it,i)=>`<div class="row">${LISTS[k][1].map(c=>f(c[0],c[1],c[2],it[c[0]],`data-l="${k}" data-i="${i}" data-f="${c[0]}"`)).join("")}<button class="o" data-del="${k}:${i}">Quitar</button></div>`).join("")}<button class="o" data-add="${k}">+ Agregar</button></fieldset>`).join("")}
<div class="bar"><button id="sv">Guardar cambios</button><button class="o" id="ex">Descargar copia</button><label class="b o" style="margin:0">Cargar copia<input type="file" id="im" accept=".json" hidden></label><button class="o" id="rs">Restablecer</button><button class="o" id="cl">Cerrar</button></div>`;}
function abrir(){W=clone(D);panel();$("#ad").style.display="block";document.body.style.overflow="hidden"}
function cerrar(){$("#ad").style.display="none";document.body.style.overflow=""}
$("#adm").onclick=()=>{const p=prompt("Contraseña de administración:");if(p===null)return;p===D.pass?abrir():alert("Contraseña incorrecta.")};
$("#ad").addEventListener("input",e=>{const t=e.target;if(t.dataset.k)W[t.dataset.k]=t.value;else if(t.dataset.l)W[t.dataset.l][t.dataset.i][t.dataset.f]=t.value});
$("#ad").addEventListener("click",e=>{const t=e.target;
if(t.dataset.add){const o={};LISTS[t.dataset.add][1].forEach(c=>o[c[0]]="");W[t.dataset.add].push(o);panel()}
else if(t.dataset.del){const[k,i]=t.dataset.del.split(":");W[k].splice(+i,1);panel()}
else if(t.id==="sv"){D=clone(W);if(save()){render();cerrar();alert("Cambios guardados en este navegador.")}}
else if(t.id==="cl")cerrar();
else if(t.id==="rs"){if(confirm("¿Borrar todos los cambios y volver al contenido original?")){try{localStorage.removeItem("iac")}catch(x){}D=clone(D0);render();cerrar()}}
else if(t.id==="ex"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(W,null,2)],{type:"application/json"}));a.download="datos-iglesia.json";a.click()}});
$("#ad").addEventListener("change",e=>{if(e.target.id==="im"){const r=new FileReader();r.onload=()=>{try{W=Object.assign(clone(D0),JSON.parse(r.result));panel()}catch(x){alert("Ese archivo no es válido.")}};r.readAsText(e.target.files[0])}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){cerrar();$("#lb").style.display="none"}});
document.addEventListener("click",e=>{const g=e.target.closest(".gal img");if(g){$("#lb").innerHTML='<img src="'+esc(g.getAttribute("src"))+'" alt="">';$("#lb").style.display="flex"}else if(e.target.closest("#lb"))$("#lb").style.display="none"});
function tick(){const el=$("#cd");if(!el)return;const n=new Date(),e=D.eventos.filter(x=>new Date(x.f+"T00:00:00")>n).sort((a,b)=>a.f.localeCompare(b.f))[0];if(!e){el.innerHTML="";return}
const t=(new Date(e.f+"T00:00:00")-n)/1e3|0,u=[["días",t/86400|0],["horas",t/3600%24|0],["min",t/60%60|0],["seg",t%60]];
el.innerHTML="<p>Próximo evento: <b>"+esc(e.n)+"</b></p><div>"+u.map(x=>"<span><b>"+x[1]+"</b>"+x[0]+"</span>").join("")+"</div>"}
setInterval(tick,1000);
render();
</script>
</body>
</html>
